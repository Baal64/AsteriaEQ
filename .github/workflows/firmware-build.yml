name: Firmware build

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

jobs:
    build:
        name: PlatformIO build
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: firmware

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install PlatformIO
              run: pip install platformio

            - name: Build firmware
              run: pio run
