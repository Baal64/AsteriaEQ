name: Documentation checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            **/*.md
            !firmware/lib/**